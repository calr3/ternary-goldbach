# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Ternary Goldbach in Lean 4"
  description: >-
    A formalization of Helfgott's proof of the ternary Goldbach conjecture: every odd integer
    greater than 5 is a sum of three primes. The proof is complete (no `sorry`), conditional on
    three published numerical results that are stated as explicit hypotheses (`Prop`s in
    `TernaryGoldbach/Statement.lean`). The main theorems use only Lean's standard axioms.
  authors: ["Charlie Reams", "Harald Helfgott"]
  responsible_maintainers: ["Charlie Reams"]
  license: "Apache-2.0"

sources:
  - title: "The ternary Goldbach problem"
    authors: ["H. A. Helfgott"]
    id: "arXiv:1501.05438v2"
    type: "article"
    location: "whole book-length preprint; main argument §14.4"
    relationship: "formalizes"
    note: >-
      The proof follows [H] closely. Some constants are re-derived or re-tuned. For example,
      Prop. 12.2.4 is proved with c₊ = 2. See BLUEPRINT.md and NOTES.md.
    author_endorsement: "participated"
  - title: "Numerical computations concerning the GRH"
    authors: ["D. J. Platt"]
    id: "arXiv:1305.3087"
    type: "article"
    location: "Math. Comp. 85 (2016), Thm 7.1; as used in [H, §9.6]"
    relationship: "background"
    note: "Assumed as the hypothesis `TernaryGoldbach.PlattGRH`."
  - title: "Empirical verification of the even Goldbach conjecture and computation of prime gaps up to 4·10¹⁸"
    authors: ["T. Oliveira e Silva", "S. Herzog", "S. Pardi"]
    id: "doi:10.1090/S0025-5718-2013-02787-1"
    type: "article"
    location: "Math. Comp. 83 (2014), Table 1 and §1.3"
    relationship: "background"
    note: "Assumed (up to 4·10¹⁸) as the hypothesis `TernaryGoldbach.BinaryGoldbachInput`."
  - title: "From explicit estimates for primes to explicit estimates for the Moebius function"
    authors: ["O. Ramaré"]
    id: "doi:10.4064/aa157-4-4"
    type: "article"
    location: "Acta Arith. 157 (2013), Cor. 1.4; as cited in [H, (2.21)]"
    relationship: "background"
    note: "Assumed as the hypothesis `TernaryGoldbach.RamareMoebius`."
  - title: "PrimeNumberTheoremAnd"
    type: "formalization"
    id: "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd"
    location: "Prelim/PNTMertens.lean"
    relationship: "adapts"
    license: "Apache-2.0"
    note: "Ported code."
    author_endorsement: "n/a"

related_formalizations: []

classification:
  arxiv: ["math.NT"]
  msc2020: ["11P32", "11N05", "11M26", "11L20", "11N35"]

status:
  scope: >-
    The complete proof of the ternary Goldbach conjecture following [H], relative to three
    published numerical results passed as hypotheses. For odd n ≥ 10²⁷ (circle method), two
    hypotheses are used: Platt's GRH verification (which also gives RH up to 10⁸) and Ramaré's
    Möbius bound. The small cases 5 < n < 10²⁷ use binary Goldbach up to 4·10¹⁸ and a prime ladder
    of 2.5·10⁸ Proth primes up to 10²⁷, which the Lean kernel checks.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "TernaryGoldbach.ternary_goldbach_of_hypotheses"
      file: "TernaryGoldbach/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/config.json"
      literature_dependencies:
        - statement: "`PlattGRH`: GRH for primitive χ mod q to height 10⁸/q (odd q ≤ 3·10⁵) or max(10⁸/q, 200 + 7.5·10⁷/q) (even q ≤ 4·10⁵)"
          source: "Platt, arXiv:1305.3087, Thm 7.1"
        - statement: "`BinaryGoldbachInput`: every even 4 ≤ n ≤ 4·10¹⁸ is a sum of two primes"
          source: "Oliveira e Silva–Herzog–Pardi, Math. Comp. 83 (2014)"
        - statement: "`RamareMoebius`: |∑_{n≤x} μ(n)/n| ≤ 0.03/log x for x ≥ 11815"
          source: "Ramaré, Acta Arith. 157 (2013), Cor. 1.4"
    - declaration: "TernaryGoldbach.ternary_goldbach_large_of_hypotheses"
      file: "TernaryGoldbach/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/config.json"
      literature_dependencies:
        - statement: "`PlattGRH`"
          source: "Platt, arXiv:1305.3087, Thm 7.1"
        - statement: "`RamareMoebius`"
          source: "Ramaré, Acta Arith. 157 (2013), Cor. 1.4"

automation:
  methods:
    - method: "agent"
      models: []
      framework: "Claude Code"
      tool_setup: "Claude Code (Anthropic) with a Lean 4 / Mathlib toolchain, run in cloud sessions"
      prompting_notes: >-
        The maintainer directed the work at the level of goals, such as "remove this hypothesis" or
        "follow [H, §12]". The agent wrote the Lean code, the generator scripts in `scripts/`,
        and the documentation.
  spend_usd: "unknown"
  notes: "Most of the Lean code was written by an AI agent under the maintainer's direction."

fidelity:
  divergences: >-
    Some constants and intermediate statements differ from [H]. For example, Prop. 12.2.4 is
    proved with c₊ = 2 instead of a finite check, and the ψ and θ bounds that [H, §2.5] quotes
    from Rosser–Schoenfeld and Ramaré–Rumely are proved (from RH up to 10⁸, which Platt's GRH
    verification gives at q = 1, and kernel-checked tables), with weaker constants in (2.14) and
    (2.17). The small cases use a kernel-checked prime ladder up to 10²⁷ instead of the
    Helfgott–Platt ladder. Several errors in [H] are corrected (e.g. (5.32),
    (6.77), and the two scales of major arcs in the proof of Thm 13.2.1); one step of Ramaré's 1995
    proof ((3.9) of [Ram95]) is false, and the formal proof avoids it. README.md, NOTES.md and
    HYPOTHESES.md list these.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    The proof is kernel-checked. The hypothesis statements were checked against their sources
    (HYPOTHESES.md). `Challenge.lean` restates the main theorems with Mathlib-only definitions for
    leanprover/comparator. `lake comparator` accepted both theorems on 2026-11-06, at commit
    83ac1e1 (comparator/README.md).

alignment:
  namespace: "TernaryGoldbach"
  statements:
    - source: "[H, Main Theorem]"
      lean: "TernaryGoldbach.ternary_goldbach_of_hypotheses"
      module: "TernaryGoldbach.MainTheorems"
      status: "proved"
      note: "Conditional on the three hypotheses above."
    - source: "[H, §14.4] (n ≥ 10²⁷)"
      lean: "TernaryGoldbach.ternary_goldbach_large_of_hypotheses"
      module: "TernaryGoldbach.MainTheorems"
      status: "proved"
    - source: "[H, §1.6] (5 < n < 10²⁷)"
      lean: "TernaryGoldbach.Helfgott.ternaryGoldbachUpTo_1e27"
      module: "TernaryGoldbach.Helfgott.SmallCases"
      status: "proved"
      note: >-
        From `BinaryGoldbachInput` and a prime ladder of Proth primes up to 10²⁷ that the kernel
        checks (`TernaryGoldbach.Ladder.ladder_prime`), in place of the Helfgott–Platt ladder.
    - source: "[H, Prop. 12.2.4]"
      lean: "TernaryGoldbach.MinorArcs.prop_12_2_4"
      module: "TernaryGoldbach.MinorArcs.LSQuot6"
      status: "proved"
      note: "With c₊ = 2."

acknowledgements: "Mathlib; PrimeNumberTheoremAnd (Prelim/PNTMertens.lean)."
